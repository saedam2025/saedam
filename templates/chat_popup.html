        async function sendDroppedChatFile(fileList) {
            if(!fileList || fileList.length === 0) return;
            if(fileList.length > 1) {
                alert('첨부파일은 한 번에 1개씩 전송할 수 있습니다.');
                return;
            }

            const fileInput = document.getElementById('chatFile');
            const transfer = new DataTransfer();
            transfer.items.add(fileList[0]);
            fileInput.files = transfer.files;
            if(!showChatFileName(fileInput)) return;
            await sendChatReply();
        }

        function initializeChatFileDrop() {
            document.addEventListener('dragenter', function(event) {
                if(!isFileDrag(event)) return;
                event.preventDefault();
                chatFileDragDepth += 1;
                document.body.classList.add('chat-file-dragging');
            });
            document.addEventListener('dragover', function(event) {
                if(!isFileDrag(event)) return;
                event.preventDefault();
                event.dataTransfer.dropEffect = 'copy';
            });
            document.addEventListener('dragleave', function(event) {
                if(!isFileDrag(event)) return;
                event.preventDefault();
                chatFileDragDepth = Math.max(0, chatFileDragDepth - 1);
                if(chatFileDragDepth === 0) clearChatFileDragState();
            });
            document.addEventListener('drop', async function(event) {
                if(!isFileDrag(event)) return;
                event.preventDefault();
                const droppedFiles = event.dataTransfer.files;
                clearChatFileDragState();
                await sendDroppedChatFile(droppedFiles);
            });
            window.addEventListener('dragend', clearChatFileDragState);
            window.addEventListener('blur', clearChatFileDragState);
        }

        function formatChatFileSize(bytes) {
            const size = Number(bytes);
            if(!Number.isFinite(size) || size < 0) return '용량 확인 불가';
            if(size < 1024) return size + ' B';
            if(size < 1024 * 1024) return (size / 1024).toFixed(1) + ' KB';
            return (size / (1024 * 1024)).toFixed(2) + ' MB';
        }

        function formatChatFileExpiry(value) {
            if(!value) return '유효기간 확인 불가';
            let dateValue = String(value);
            if(!dateValue.endsWith('Z')) dateValue = dateValue.replace(' ', 'T') + 'Z';
            const expiry = new Date(dateValue);
            if(Number.isNaN(expiry.getTime())) return '유효기간 확인 불가';
            return '유효기간 ' + expiry.toLocaleDateString('ko-KR') + '까지';
        }

        function mergeLoadedMessages(messages, reset) {
            if (reset) {
                loadedMessages = messages.slice();
            } else {
                const byId = new Map(loadedMessages.map(item => [Number(item.id), item]));
                messages.forEach(item => byId.set(Number(item.id), item));
                loadedMessages = Array.from(byId.values()).sort((a, b) => Number(a.id) - Number(b.id));
            }
            oldestMessageId = loadedMessages.length ? Number(loadedMessages[0].id) : null;
            lastMessageId = loadedMessages.length ? Number(loadedMessages[loadedMessages.length - 1].id) : 0;
        }

        function renderLoadedMessages(options = {}) {
            const box = document.getElementById('chatBox');
            const keepTop = box.scrollTop;
            const wasNearBottom = box.scrollHeight - keepTop - box.clientHeight < 90;
            box.innerHTML = '';
            if (hasOlderMessages && oldestMessageId) {
                const olderButton = document.createElement('button');
                olderButton.type = 'button';
                olderButton.className = 'chat-load-older';
                olderButton.textContent = '이전 대화 불러오기';
                olderButton.onclick = loadOlderMessages;
                box.appendChild(olderButton);
            }
            if (!loadedMessages.length) {
                const empty = document.createElement('div');
                empty.style.cssText = 'text-align:center;padding:35px 0;color:#94a3b8;font-size:0.82rem;';
                empty.textContent = '아직 대화가 없습니다.';
                box.appendChild(empty);
                return;
            }

            loadedMessages.forEach(c => {
                const isMe = String(c.sender).trim() === String(currentUser).trim();
                let dateStr = c.sent_at;
                if (dateStr && !dateStr.endsWith('Z')) dateStr = dateStr.replace(' ', 'T') + 'Z';
                const d = new Date(dateStr || Date.now());
                const timeStr = d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
                let unreadNum = parseInt(c.unread_count, 10);
                if (isNaN(unreadNum) || partnerName === currentUser) unreadNum = 0;
                const unreadHtml = unreadNum > 0 && (isMe || roomInfo.is_group)
                    ? `<span style="color:#004ea2;font-size:0.70rem;margin-bottom:2px;">${unreadNum}</span>`
                    : '';
                const editedHtml = c.edited_at ? '<span class="chat-edited-label">(수정됨)</span>' : '';

                let fileHtml = '';
                if(c.filename && !c.is_deleted) {
                    const ext = c.filename.split('.').pop().toLowerCase();
                    const attachmentUrl = '/chat/attachment/' + encodeURIComponent(c.id);
                    const safeFilename = escapeHtml(c.filename);
                    // 서버가 용량 0을 주면 실제 파일을 찾지 못한 것이므로 깨진 이미지 대신 상태를 알린다.
                    const isMissing = !Number(c.file_size);
                    const fileMeta = escapeHtml(isMissing
                        ? '보관기간이 지났거나 삭제된 파일입니다'
                        : formatChatFileSize(c.file_size) + ' · ' + formatChatFileExpiry(c.expires_at));
                    const downloadLink = isMissing
                        ? `<span class="chat-attachment-link chat-attachment-gone" title="${safeFilename}"><i class="fa-solid fa-link-slash"></i><span class="chat-attachment-info"><span class="chat-attachment-name">${safeFilename}</span><span class="chat-attachment-meta">${fileMeta}</span></span></span>`
                        : `<a class="chat-attachment-link" href="${attachmentUrl}?download=1" title="${safeFilename}"><i class="fa-solid fa-paperclip"></i><span class="chat-attachment-info"><span class="chat-attachment-name">${safeFilename}</span><span class="chat-attachment-meta">${fileMeta}</span></span><i class="fa-solid fa-download" style="margin-left:auto;"></i></a>`;
                    fileHtml = (!isMissing && ['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext))
                        ? `<div style="margin-top:8px;"><img src="${attachmentUrl}" alt="${safeFilename}" class="chat-attachment-preview" onerror="this.style.display='none';" onclick="window.open('${attachmentUrl}', '_blank')">${downloadLink}</div>`
                        : downloadLink;
                }
                const replyHtml = c.reply
                    ? `<div class="chat-reply-preview" onclick="event.stopPropagation(); ${loadedMessages.some(item => Number(item.id) === Number(c.reply.id)) ? `scrollToMessage(${Number(c.reply.id)}, true)` : `openSearchResult(${Number(c.reply.id)})`}"><strong>${escapeHtml(c.reply.sender || '메시지')}</strong>${escapeHtml(c.reply.content || (c.reply.filename ? '📎 ' + c.reply.filename : '메시지'))}</div>`
                    : '';
                const reactionHtml = c.is_deleted ? '' : renderMessageReactions(c.id, c.reactions || []);
                const commentsHtml = c.is_deleted ? '' : renderMessageComments(c.comments || []);
                const messageContent = c.is_deleted
                    ? '<span class="chat-deleted-message">삭제된 메시지입니다.</span>'
                    : ChatEmoji.renderText(c.content || '');
                const stickerBubbleClass = !c.is_deleted && ChatEmoji.hasSticker(c.content || '') ? ' has-sticker' : '';
                const attachmentBubbleClass = c.filename ? ' has-attachment' : '';
                const fileOnlyBubbleClass = c.filename && !String(c.content || '').trim() ? ' only-file' : '';
                const msgDiv = document.createElement('div');
                msgDiv.dataset.messageId = c.id;
                msgDiv.style.display = 'flex';
                msgDiv.style.flexDirection = 'column';
                msgDiv.style.alignItems = isMe ? 'flex-end' : 'flex-start';
                msgDiv.style.marginBottom = '12px';
                msgDiv.oncontextmenu = event => openMessageContextMenu(event, c.id, isMe);
                msgDiv.onclick = event => selectChatMessage(c.id, event);
                if (isMe && Number(selectedMessageId) === Number(c.id)) msgDiv.classList.add('chat-selected');

                const bubbleHtml = `${replyHtml}${messageContent}${fileHtml}`;
                if (isMe) {
                    msgDiv.innerHTML = `
                        <div class="chat-message-row me">
                            <div class="message-meta me">${unreadHtml}<span style="font-size:0.7rem;color:#64748b;">${timeStr}${editedHtml}</span></div>
                            <div class="chat-bubble-wrap${attachmentBubbleClass}">
                                <div class="chat-bubble me${attachmentBubbleClass}${fileOnlyBubbleClass}${stickerBubbleClass}">${bubbleHtml}</div>
                                ${reactionHtml}${commentsHtml}
                            </div>
                        </div>`;
                } else {
                    msgDiv.innerHTML = `
                        <div class="chat-message-row other">
                            <div class="chat-message-avatar">${profileAvatarContent(c.sender)}</div>
                            <div style="display:flex;flex-direction:column;align-items:flex-start;min-width:0;">
                                <div style="font-size:0.85rem;color:#64748b;margin-bottom:3px;font-weight:bold;">${escapeHtml(c.sender)}</div>
                                <div style="display:flex;align-items:flex-end;">
                                    <div class="chat-bubble-wrap${attachmentBubbleClass}">
                                        <div class="chat-bubble other${attachmentBubbleClass}${fileOnlyBubbleClass}${stickerBubbleClass}">${bubbleHtml}</div>
                                        ${reactionHtml}${commentsHtml}
                                    </div>
                                    <div class="message-meta other">${unreadHtml}<span style="font-size:0.7rem;color:#64748b;">${timeStr}${editedHtml}</span></div>
                                </div>
                            </div>
                        </div>`;
                }
                const poll = pollByMessageUid[c.message_uid];
                if (poll) {
                    const pollWrap = document.createElement('div');
                    pollWrap.style.cssText = 'width:100%;';
                    pollWrap.innerHTML = renderPollCard(poll);
                    msgDiv.appendChild(pollWrap);
                }
                box.appendChild(msgDiv);
            });

            if (options.preserveScroll) {
                requestAnimationFrame(function() {
                    box.scrollTop = wasNearBottom ? box.scrollHeight : keepTop;
                });
            }
        }

        async function loadChatMessages(options = {}) {
            if (messageLoadInProgress) return;
            messageLoadInProgress = true;
            const box = document.getElementById('chatBox');
            const oldHeight = box.scrollHeight;
            const oldTop = box.scrollTop;
            const wasNearBottom = oldHeight - oldTop - box.clientHeight < 90;
            const params = new URLSearchParams({ limit: '50', t: String(Date.now()) });
            if (options.beforeId) params.set('before_id', String(options.beforeId));
            if (options.afterId) params.set('after_id', String(options.afterId));
            if (options.aroundId) params.set('around_id', String(options.aroundId));
            try {
                const res = await fetch(`/get_chat_history/${encodeURIComponent(partnerName)}?${params.toString()}`);
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || '대화를 불러오지 못했습니다.');
                const messages = Array.isArray(data) ? data : (data.messages || []);
                mergeLoadedMessages(messages, !!options.reset);
                if (!options.afterId) hasOlderMessages = !!data.has_more;
                if (data.room) applyRoomInfo(data.room);
                renderLoadedMessages();
                requestAnimationFrame(() => {
                    if (options.beforeId) {
                        box.scrollTop = box.scrollHeight - oldHeight + oldTop;
                    } else if (options.aroundId) {
                        scrollToMessage(options.aroundId, true);
                    } else if (!options.preserveScroll && (options.reset || wasNearBottom)) {
                        box.scrollTop = box.scrollHeight;
                    } else {
                        box.scrollTop = Math.min(oldTop, box.scrollHeight - box.clientHeight);
                    }
                });
                notifyOpenerUnreadChanged();
            } catch (error) {
                console.error('채팅 로드 실패:', error);
                if (!loadedMessages.length) box.innerHTML = `<div style="padding:30px;text-align:center;color:#ef4444;">${escapeHtml(error.message)}</div>`;
            } finally {
                messageLoadInProgress = false;
            }
        }

        async function loadOlderMessages() {
            if (!oldestMessageId || !hasOlderMessages) return;
            await loadChatMessages({ beforeId: oldestMessageId });
        }

        async function refreshChatBox() {
            if (!loadedMessages.length) return loadChatMessages({ reset: true });
            return loadChatMessages({ afterId: lastMessageId });
        }

        let chatSendInProgress = false;
        async function sendChatReply(options = {}) {
            if (chatSendInProgress) return;
            const input = document.getElementById('chatInput');
            const fileInput = document.getElementById('chatFile');
            const stickerOnly = options && options.stickerOnly === true;
            const inputSnapshot = input.value;
            const selectedFile = stickerOnly ? null : fileInput.files[0];
            const content = ChatEmoji.compose(stickerOnly ? '' : inputSnapshot.trim());
            if(!content && !selectedFile) return;
            if(selectedFile && selectedFile.size >= CHAT_MAX_FILE_BYTES) {
                showChatFileName(fileInput);
                return;
            }
            
            let formData = new FormData();
            if (roomInfo.is_group) formData.append('room_id', partnerName);
            formData.append('receiver', partnerName);
            formData.append('content', content);
            if (replyTarget) formData.append('reply_to_id', String(replyTarget.id));
            if(selectedFile) formData.append('file', selectedFile);

            chatSendInProgress = true;
            document.getElementById('chatSendButton').disabled = true;
            try {
                const res = await fetch('/send_message', { method: 'POST', body: formData });
                if(res.ok) { 
                    if (!stickerOnly && input.value === inputSnapshot) input.value = '';
                    if (!stickerOnly) fileInput.value = '';
                    ChatEmoji.sent(content);
                    resizeChatInput(input);
                    showChatFileName(fileInput);
                    cancelReply();
                    if (!stickerOnly) sendTypingState(false);
                    await refreshChatBox();
                } else {
                    const error = await res.json().catch(() => ({}));
                    alert(error.message || '메시지를 전송하지 못했습니다.');
                }
            } catch (e) { alert("메시지 전송 중 오류가 발생했습니다."); }
            finally {
                chatSendInProgress = false;
                document.getElementById('chatSendButton').disabled = false;
            }
        }

        function handleChatInputKeydown(event) {
            if (event.key !== 'Enter' || event.isComposing) return;
            if (event.shiftKey) return;
            event.preventDefault();
            sendChatReply();
        }

        function sendTypingState(isTyping) {
            if (!chatSocket || !chatSocket.connected) return;
            chatSocket.emit('typing', { partner: partnerName, is_typing: !!isTyping });
            if (!isTyping) lastTypingSentAt = 0;
        }

        function resizeChatInput(input) {
            input.style.height = 'auto';
            input.style.height = `${Math.min(input.scrollHeight, 110)}px`;
        }

        function handleChatInput() {
            const input = document.getElementById('chatInput');
            resizeChatInput(input);
            if (!input.value) {
                clearTimeout(typingStopTimer);
                sendTypingState(false);
                return;
            }
            const now = Date.now();
            if (now - lastTypingSentAt > 450) {
                sendTypingState(true);
                lastTypingSentAt = now;
            }
            clearTimeout(typingStopTimer);
            typingStopTimer = setTimeout(() => sendTypingState(false), 1800);
        }

        /* ===== 대화창 상단 메뉴바 3종: 업무요청 / 설문·투표 / 상태표시 ===== */

        function formatChatDateTime(value) {
            if (!value) return '';
            let dateValue = String(value);
            if (!dateValue.endsWith('Z')) dateValue = dateValue.replace(' ', 'T') + 'Z';
            const parsed = new Date(dateValue);
            if (Number.isNaN(parsed.getTime())) return String(value);
            return parsed.toLocaleString('ko-KR', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        function roomMemberNames() {
            const members = Array.isArray(roomInfo.members) ? roomInfo.members : [];
            return members
                .map(member => (typeof member === 'string' ? member : (member && member.name) || ''))
                .filter(name => name && name !== currentUser);
        }

        function toggleChatPanel(name) {
            chatOpenPanel = chatOpenPanel === name ? '' : name;
            [['task', 'chatTaskPanel', 'chatMenuTaskBtn'],
             ['poll', 'chatPollPanel', 'chatMenuPollBtn'],
             ['status', 'chatStatusPanel', 'chatMenuStatusBtn']].forEach(function(entry) {
                const isOpen = chatOpenPanel === entry[0];
                document.getElementById(entry[1]).classList.toggle('open', isOpen);
                document.getElementById(entry[2]).classList.toggle('active', isOpen);
            });
            if (chatOpenPanel === 'task') loadTaskRequests();
            if (chatOpenPanel === 'poll') renderPollPanel();
            if (chatOpenPanel === 'status') { renderStatusPanel(); loadChatStatuses(); }
        }

        function selectChatMessage(messageId, event) {
            if (event && event.target && event.target.closest('a, img, button, input, label, .message-reaction-chip, .chat-poll-card')) return;
            const message = loadedMessages.find(item => Number(item.id) === Number(messageId));
            if (!message || message.sender !== currentUser || message.is_deleted) return;
            selectedMessageId = Number(selectedMessageId) === Number(messageId) ? null : Number(messageId);
            document.querySelectorAll('#chatBox [data-message-id]').forEach(function(node) {
                node.classList.toggle('chat-selected', Number(node.dataset.messageId) === Number(selectedMessageId));
            });
            if (chatOpenPanel === 'task') renderTaskPanel();
        }

        /* --- 1. 업무요청 --- */

        function updateTaskBadge(count) {
            taskPendingCount = Math.max(0, parseInt(count, 10) || 0);
            const badge = document.getElementById('chatTaskBadge');
            badge.textContent = taskPendingCount > 99 ? '99+' : String(taskPendingCount);
            badge.style.display = taskPendingCount > 0 ? 'inline-block' : 'none';
        }

        async function loadTaskRequests(box) {
            if (box) taskBox = box;
            try {
                const res = await fetch('/api/chat/task-requests?box=' + encodeURIComponent(taskBox));
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || '업무요청을 불러오지 못했습니다.');
                taskRequests = Array.isArray(data.requests) ? data.requests : [];
                updateTaskBadge(data.pending_received);
            } catch (error) {
                taskRequests = [];
                console.error(error);
            }
            if (chatOpenPanel === 'task') renderTaskPanel();
        }

        async function refreshTaskBadge() {
            try {
                const res = await fetch('/api/chat/task-requests?box=received');
                const data = await res.json();
                if (res.ok) updateTaskBadge(data.pending_received);
            } catch (error) { /* 배지는 실패해도 대화에는 영향 없음 */ }
        }

        function taskStatusChip(status) {
            if (status === 'done') return '<span class="chat-task-chip done">완료</span>';
            if (status === 'canceled') return '<span class="chat-task-chip canceled">취소됨</span>';
            return '<span class="chat-task-chip pending">진행중</span>';
        }

        function renderTaskPanel() {
            const panel = document.getElementById('chatTaskPanel');
            const selected = loadedMessages.find(item => Number(item.id) === Number(selectedMessageId));
            const canRegister = !!(selected && selected.sender === currentUser && !selected.is_deleted);
            const preview = selected
                ? (selected.content || (selected.filename ? '📎 ' + selected.filename : '')).replace(/\n/g, ' ')
                : '';
            const picker = `
                <div class="chat-task-picker">
                    <i class="fa-regular fa-hand-pointer" style="color:#2563eb;"></i>
                    <span class="chat-task-picker-text">${canRegister ? '선택한 메시지 · ' + escapeHtml(preview) : '내가 보낸 말풍선을 클릭하면 업무요청으로 등록할 수 있습니다.'}</span>
                    <button type="button" class="chat-mini-btn" ${canRegister ? '' : 'disabled style="opacity:0.45;cursor:default;"'} onclick="createTaskRequest()">업무요청 등록</button>
                </div>`;

            const tabs = `
                <div class="chat-panel-tabs">
                    <button type="button" class="chat-panel-tab ${taskBox === 'received' ? 'active' : ''}" onclick="loadTaskRequests('received')">받은 요청${taskPendingCount > 0 ? ' (' + taskPendingCount + ')' : ''}</button>
                    <button type="button" class="chat-panel-tab ${taskBox === 'sent' ? 'active' : ''}" onclick="loadTaskRequests('sent')">보낸 요청</button>
                </div>`;

            const items = taskRequests.length
                ? taskRequests.map(function(task) {
                    const isReceived = task.direction === 'received';
                    const canRespond = isReceived && task.status === 'pending';
                    const canCancel = !isReceived && task.status === 'pending';
                    const canOpen = task.message_id && task.room_key === partnerName;
                    const responseHtml = task.response_text
                        ? `<div class="chat-task-response"><b>응답</b> · ${escapeHtml(formatChatDateTime(task.responded_at))}<br>${escapeHtml(task.response_text)}</div>`
                        : '';
                    const actions = [
                        canRespond ? `<button type="button" class="chat-mini-btn" onclick="respondTaskRequest(${task.id})"><i class="fa-solid fa-reply"></i> 응답</button>` : '',
                        canCancel ? `<button type="button" class="chat-mini-btn" onclick="cancelTaskRequest(${task.id})">요청 취소</button>` : '',
                        canOpen ? `<button type="button" class="chat-mini-btn" onclick="openSearchResult(${task.message_id})">원본 메시지</button>` : ''
                    ].filter(Boolean).join('');
                    return `
                        <div class="chat-task-item">
                            <div class="chat-task-head">
                                ${taskStatusChip(task.status)}
                                <span>${escapeHtml(task.requester)} → ${escapeHtml(task.assignee)}</span>
                                <span style="margin-left:auto;">${escapeHtml(formatChatDateTime(task.created_at))}</span>
                            </div>
                            <div class="chat-task-content">${escapeHtml(task.content)}</div>
                            ${responseHtml}
                            ${actions ? '<div class="chat-task-actions">' + actions + '</div>' : ''}
                        </div>`;
                }).join('')
                : '<div class="chat-panel-empty">표시할 업무요청이 없습니다.</div>';

            panel.innerHTML = picker + tabs + items;
        }

        async function createTaskRequest(messageId) {
            const targetId = messageId || selectedMessageId;
            if (!targetId) return alert('업무요청으로 등록할 내 메시지를 먼저 선택해주세요.');
            hideMessageContextMenu();
            const res = await fetch('/api/chat/task-request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message_id: Number(targetId) })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) return alert(data.message || '업무요청을 등록하지 못했습니다.');
            alert((data.created || []).join(', ') + '님의 업무요청함에 등록했습니다.');
            selectedMessageId = null;
            renderLoadedMessages();
            taskBox = 'sent';
            if (chatOpenPanel !== 'task') toggleChatPanel('task');
            else loadTaskRequests('sent');
        }

        function respondTaskRequest(requestId) {
            const task = taskRequests.find(item => Number(item.id) === Number(requestId));
            taskResponseId = Number(requestId);
            document.getElementById('taskResponseTarget').textContent = '요청 내용 · ' + ((task && task.content) || '');
            document.getElementById('taskResponseText').value = '';
            document.getElementById('taskResponseFile').value = '';
            showTaskResponseFileName();
            document.getElementById('taskResponseModal').style.display = 'block';
            document.getElementById('taskResponseText').focus();
        }

        function closeTaskResponseModal() {
            taskResponseId = null;
            document.getElementById('taskResponseModal').style.display = 'none';
        }

        function showTaskResponseFileName() {
            const input = document.getElementById('taskResponseFile');
            const nameDiv = document.getElementById('taskResponseFileName');
            if (input.files && input.files.length > 0) {
                const file = input.files[0];
                if (file.size >= CHAT_MAX_FILE_BYTES) {
                    alert('첨부파일은 개당 10MB 미만만 업로드할 수 있습니다.');
                    input.value = '';
                    nameDiv.style.display = 'none';
                    return;
                }
                nameDiv.textContent = '📎 ' + file.name + ' (' + (file.size / (1024 * 1024)).toFixed(2) + 'MB · 30일 보관)';
                nameDiv.style.display = 'block';
                return;
            }
            nameDiv.textContent = '';
            nameDiv.style.display = 'none';
        }

        async function submitTaskResponse() {
            if (!taskResponseId) return;
            const text = String(document.getElementById('taskResponseText').value || '').trim();
            const fileInput = document.getElementById('taskResponseFile');
            const hasFile = fileInput.files && fileInput.files.length > 0;
            if (!text && !hasFile) return alert('응답 내용이나 첨부파일을 입력해주세요.');
            if (hasFile && fileInput.files[0].size >= CHAT_MAX_FILE_BYTES) {
                showTaskResponseFileName();
                return;
            }
            const formData = new FormData();
            formData.append('content', text);
            if (hasFile) formData.append('file', fileInput.files[0]);
            const res = await fetch('/api/chat/task-request/' + taskResponseId + '/respond', {
                method: 'POST',
                body: formData
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) return alert(data.message || '응답을 전송하지 못했습니다.');
            closeTaskResponseModal();
            await loadTaskRequests();
            await loadChatMessages({ reset: true });
        }

        async function cancelTaskRequest(requestId) {
            if (!confirm('이 업무요청을 취소할까요?')) return;
            const res = await fetch('/api/chat/task-request/' + requestId + '/cancel', { method: 'POST' });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) return alert(data.message || '업무요청을 취소하지 못했습니다.');
            await loadTaskRequests();
        }

        /* --- 2. 설문/투표 --- */

        function renderPollPanel() {
            const panel = document.getElementById('chatPollPanel');
            if (panel.dataset.ready === '1') return;
            panel.innerHTML = roomInfo.is_group
                ? `
                <div class="chat-poll-form">
                    <input type="text" id="pollQuestionInput" maxlength="200" placeholder="질문을 입력하세요 (예: 회식 날짜 투표)">
                    <div class="chat-poll-form-options" id="pollOptionInputs">
                        <div class="chat-poll-form-row"><input type="text" class="chat-poll-option-input" maxlength="100" placeholder="보기 1"></div>
                        <div class="chat-poll-form-row"><input type="text" class="chat-poll-option-input" maxlength="100" placeholder="보기 2"></div>
                    </div>
                    <div class="chat-poll-form-deadline">
                        <label for="pollDeadlineInput"><i class="fa-regular fa-clock"></i> 마감기한</label>
                        <input type="datetime-local" id="pollDeadlineInput">
                        <button type="button" class="chat-mini-btn" onclick="document.getElementById('pollDeadlineInput').value='';">기한 없음</button>
                    </div>
                    <div class="chat-poll-form-toggles">
                        <label><input type="checkbox" id="pollAllowMultiple"> 복수 선택</label>
                        <label><input type="checkbox" id="pollAnonymous"> 익명 투표</label>
                    </div>
                    <div style="display:flex; gap:6px;">
                        <button type="button" class="chat-mini-btn" onclick="addPollOptionInput()"><i class="fa-solid fa-plus"></i> 보기 추가</button>
                        <button type="button" class="chat-mini-btn" style="margin-left:auto; background:#2563eb; color:#fff; border-color:#2563eb;" onclick="submitChatPoll()">설문 만들기</button>
                    </div>
                </div>
                <div class="chat-panel-note">만든 설문/투표는 대화창에 카드로 표시됩니다. 참여와 마감은 대화창에서 하세요.</div>`
                : '<div class="chat-panel-note">설문/투표는 단체 대화방에서만 만들 수 있습니다.</div>';
            panel.dataset.ready = '1';
        }

        function addPollOptionInput() {
            const box = document.getElementById('pollOptionInputs');
            if (!box) return;
            const count = box.querySelectorAll('.chat-poll-option-input').length;
            if (count >= 10) return alert('보기는 최대 10개까지 등록할 수 있습니다.');
            const row = document.createElement('div');
            row.className = 'chat-poll-form-row';
            row.innerHTML = `<input type="text" class="chat-poll-option-input" maxlength="100" placeholder="보기 ${count + 1}">
                <button type="button" class="chat-mini-btn" onclick="this.parentNode.remove()"><i class="fa-solid fa-xmark"></i></button>`;
            box.appendChild(row);
            row.querySelector('input').focus();
        }

        async function loadChatPolls(options = {}) {
            try {
                const res = await fetch('/api/chat/polls?partner=' + encodeURIComponent(partnerName));
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || '설문을 불러오지 못했습니다.');
                chatPolls = Array.isArray(data.polls) ? data.polls : [];
            } catch (error) {
                chatPolls = [];
                console.error(error);
            }
            pollByMessageUid = {};
            chatPolls.forEach(function(poll) {
                if (poll.message_uid) pollByMessageUid[poll.message_uid] = poll;
            });
            if (!options.skipRender) renderLoadedMessages({ preserveScroll: true });
        }

        function pollDeadlineHtml(poll) {
            if (poll.status !== 'open') {
                return '<span class="chat-poll-deadline closed"><i class="fa-regular fa-circle-check"></i>마감됨</span>';
            }
            if (!poll.deadline) return '';
            return `<span class="chat-poll-deadline"><i class="fa-regular fa-clock"></i>${escapeHtml(formatChatDateTime(poll.deadline))}까지</span>`;
        }

        function renderPollCard(poll) {
            const isOpen = poll.status === 'open';
            const total = poll.options.reduce(function(sum, option) { return sum + option.count; }, 0);
            const inputType = poll.allow_multiple ? 'checkbox' : 'radio';
            const options = poll.options.map(function(option) {
                const percent = total > 0 ? Math.round((option.count / total) * 100) : 0;
                const checked = poll.my_votes.includes(option.index) ? 'checked' : '';
                const voters = (!poll.is_anonymous && option.voters.length)
                    ? `<span class="chat-poll-voters">${escapeHtml(option.voters.join(', '))}</span>`
                    : '';
                const input = isOpen
                    ? `<input type="${inputType}" name="poll-${poll.id}" value="${option.index}" ${checked}>`
                    : '';
                return `
                    <label class="chat-poll-option">
                        ${input}
                        <span class="chat-poll-option-body">
                            <span class="chat-poll-option-label"><span>${escapeHtml(option.text)}</span><span style="color:#2563eb;font-weight:800;">${option.count}표 · ${percent}%</span></span>
                            <span class="chat-poll-bar"><span class="chat-poll-bar-fill" style="width:${percent}%;"></span></span>
                            ${voters}
                        </span>
                    </label>`;
            }).join('');
            const actions = [
                isOpen ? `<button type="button" class="chat-mini-btn" style="background:#2563eb;color:#fff;border-color:#2563eb;" onclick="submitPollVote(${poll.id})">투표하기</button>` : '',
                (isOpen && poll.can_close) ? `<button type="button" class="chat-mini-btn" onclick="closeChatPoll(${poll.id})">지금 마감</button>` : ''
            ].filter(Boolean).join('');
            return `
                <div class="chat-poll-card in-chat">
                    <div class="chat-poll-question">📊 ${escapeHtml(poll.question)}</div>
                    <div class="chat-poll-meta">${escapeHtml(poll.creator)} · ${poll.allow_multiple ? '복수선택' : '단일선택'}${poll.is_anonymous ? ' · 익명' : ''} · ${poll.total_voters}명 참여 ${pollDeadlineHtml(poll)}</div>
                    ${options}
                    ${actions ? '<div class="chat-poll-actions">' + actions + '</div>' : ''}
                </div>`;
        }

        async function submitChatPoll() {
            const question = String(document.getElementById('pollQuestionInput').value || '').trim();
            const options = Array.from(document.querySelectorAll('.chat-poll-option-input'))
                .map(input => String(input.value || '').trim())
                .filter(Boolean);
            if (!question) return alert('질문을 입력해주세요.');
            if (options.length < 2) return alert('보기를 2개 이상 입력해주세요.');
            const deadlineValue = String(document.getElementById('pollDeadlineInput').value || '').trim();
            let deadline = '';
            if (deadlineValue) {
                const parsed = new Date(deadlineValue);
                if (Number.isNaN(parsed.getTime())) return alert('마감기한을 다시 선택해주세요.');
                if (parsed.getTime() <= Date.now()) return alert('마감기한은 현재 시각 이후로 정해주세요.');
                deadline = parsed.toISOString();
            }
            const res = await fetch('/api/chat/poll', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    partner: partnerName,
                    question: question,
                    options: options,
                    deadline: deadline,
                    allow_multiple: document.getElementById('pollAllowMultiple').checked,
                    is_anonymous: document.getElementById('pollAnonymous').checked
                })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) return alert(data.message || '설문을 만들지 못했습니다.');
            document.getElementById('pollQuestionInput').value = '';
            document.getElementById('pollOptionInputs').innerHTML =
                '<div class="chat-poll-form-row"><input type="text" class="chat-poll-option-input" maxlength="100" placeholder="보기 1"></div>' +
                '<div class="chat-poll-form-row"><input type="text" class="chat-poll-option-input" maxlength="100" placeholder="보기 2"></div>';
            document.getElementById('pollAllowMultiple').checked = false;
            document.getElementById('pollAnonymous').checked = false;
            document.getElementById('pollDeadlineInput').value = '';
            toggleChatPanel('poll');
            await loadChatPolls({ skipRender: true });
            await refreshChatBox();
        }

        async function submitPollVote(pollId) {
            const selected = Array.from(document.querySelectorAll('input[name="poll-' + pollId + '"]:checked'))
                .map(input => Number(input.value));
            if (!selected.length) return alert('선택한 보기가 없습니다.');
            const res = await fetch('/api/chat/poll/' + pollId + '/vote', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ options: selected })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) return alert(data.message || '투표하지 못했습니다.');
            await loadChatPolls();
        }


        async function closeChatPoll(pollId) {
            if (!confirm('이 설문을 마감할까요?')) return;
            const res = await fetch('/api/chat/poll/' + pollId + '/close', { method: 'POST' });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) return alert(data.message || '설문을 마감하지 못했습니다.');
            await loadChatPolls();
        }

        /* --- 3. 상태표시 --- */

        async function loadChatStatuses() {
            const targets = roomInfo.is_group ? roomMemberNames() : [partnerName];
            try {
                const res = await fetch('/api/chat/status?users=' + encodeURIComponent(targets.join(',')));
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || '');
                statusPresets = Array.isArray(data.presets) ? data.presets : statusPresets;
                myStatus = data.my_status || null;
                memberStatuses = data.statuses || {};
            } catch (error) {
                console.error('상태 정보를 불러오지 못했습니다.', error);
            }
            updateStatusButton();
            renderStatusBanner();
            if (chatOpenPanel === 'status') renderStatusPanel();
        }

        function updateStatusButton() {
            const dot = document.getElementById('chatStatusDot');
            const label = document.getElementById('chatStatusBtnLabel');
            const button = document.getElementById('chatMenuStatusBtn');
            label.textContent = '상태표시';
            if (myStatus && myStatus.status) {
                dot.style.background = myStatus.color || '#94a3b8';
                button.title = `내 상태: ${myStatus.icon} ${myStatus.label}` + (myStatus.message ? ` (${myStatus.message})` : '');
            } else {
                dot.style.background = '#cbd5e1';
                button.title = '자리비움·회의중 등 내 상태 표시';
            }
        }

        function renderStatusPanel() {
            const panel = document.getElementById('chatStatusPanel');
            const current = (myStatus && myStatus.status) || '';
            const options = statusPresets.map(function(preset) {
                return `<button type="button" class="chat-status-option ${preset.key === current ? 'active' : ''}" style="${preset.key === current ? 'border-color:' + preset.color + ';' : ''}" onclick="setMyChatStatus('${preset.key}')">
                    <span class="chat-status-option-icon">${preset.icon}</span><span>${escapeHtml(preset.label)}</span>
                </button>`;
            }).join('');
            const memberRows = Object.keys(memberStatuses)
                .filter(name => memberStatuses[name] && memberStatuses[name].status)
                .map(name => `<div class="chat-status-chip"><span>${memberStatuses[name].icon}</span>${escapeHtml(name)} · ${escapeHtml(memberStatuses[name].label)}${memberStatuses[name].message ? ' (' + escapeHtml(memberStatuses[name].message) + ')' : ''}</div>`)
                .join('');
            panel.innerHTML = `
                <div class="chat-panel-note" style="margin-bottom:8px;">내 상태를 선택하면 나와 대화하는 사람의 대화창에 상태 아이콘이 표시됩니다. (상대는 계속 메시지를 보낼 수 있습니다.)</div>
                <div class="chat-status-grid">${options}</div>
                <div class="chat-status-message-row">
                    <input type="text" id="chatStatusMessageInput" maxlength="60" placeholder="상태 메모 (예: 15시 복귀)" value="${escapeHtml((myStatus && myStatus.message) || '')}">
                    <button type="button" class="chat-mini-btn" onclick="setMyChatStatus((myStatus && myStatus.status) || '')">메모 저장</button>
                </div>
                <div style="display:flex; gap:6px; margin-bottom:10px;">
                    <button type="button" class="chat-mini-btn" onclick="setMyChatStatus('')"><i class="fa-solid fa-rotate-left"></i> 상태 해제</button>
                </div>
                ${memberRows ? '<div style="font-size:0.74rem;color:#64748b;margin-bottom:5px;">대화 상대 상태</div><div class="chat-status-chips visible">' + memberRows + '</div>' : ''}`;
        }

        async function setMyChatStatus(statusKey) {
            const input = document.getElementById('chatStatusMessageInput');
            const message = input ? String(input.value || '').trim() : '';
            const res = await fetch('/api/chat/status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: statusKey || '', message: message })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) return alert(data.message || '상태를 변경하지 못했습니다.');
            myStatus = data.my_status || null;
            updateStatusButton();
            renderStatusPanel();
        }

        function renderStatusBanner() {
            const banner = document.getElementById('chatStatusBanner');
            const chips = document.getElementById('chatStatusChips');
            const active = Object.keys(memberStatuses)
                .map(name => memberStatuses[name])
                .filter(status => status && status.status);

            if (!roomInfo.is_group) {
                chips.classList.remove('visible');
                const status = memberStatuses[partnerName];
                if (partnerName !== currentUser && status && status.status) {
                    document.getElementById('chatStatusBannerIcon').textContent = status.icon;
                    document.getElementById('chatStatusBannerTitle').textContent = `${status.user}님은 지금 "${status.label}" 상태입니다.`;
                    document.getElementById('chatStatusBannerDesc').textContent =
                        (status.message ? status.message + ' · ' : '') + '메시지는 그대로 보낼 수 있으며, 확인 후 답장이 올 수 있습니다.';
                    banner.style.borderLeftColor = status.color || '#94a3b8';
                    banner.classList.add('visible');
                } else {
                    banner.classList.remove('visible');
                }
                return;
            }

            banner.classList.remove('visible');
            if (!active.length) {
                chips.classList.remove('visible');
                chips.innerHTML = '';
                return;
            }
            chips.innerHTML = active.map(status =>
                `<span class="chat-status-chip" style="border-color:${status.color};"><span style="font-size:1rem;">${status.icon}</span>${escapeHtml(status.user)} · ${escapeHtml(status.label)}${status.message ? ' (' + escapeHtml(status.message) + ')' : ''}</span>`
            ).join('');
            chips.classList.add('visible');
        }

        function applyChatStatusEvent(payload) {
            if (!payload || !payload.user) return;
            if (payload.user === currentUser) {
                myStatus = payload;
                updateStatusButton();
                if (chatOpenPanel === 'status') renderStatusPanel();
                return;
            }
            const targets = roomInfo.is_group ? roomMemberNames() : [partnerName];
            if (!targets.includes(payload.user)) return;
            memberStatuses[payload.user] = payload;
            renderStatusBanner();
            if (chatOpenPanel === 'status') renderStatusPanel();
        }

        function initializeChatSocket() {
            if (typeof io !== 'function') return;
            chatSocket = io('/chat', {
                transports: ['polling'],
                upgrade: false,
                reconnection: true,
                reconnectionDelay: 1000
            });
            chatSocket.on('connect', () => {
                chatSocket.emit('join_chat', { partner: partnerName });
                refreshChatBox();
            });
            chatSocket.on('chat_event', async event => {
                if (!event || event.partner !== partnerName) return;
                if (event.type === 'message') {
                    notifyIncomingChatMessage(event);
                    await refreshChatBox();
                } else if (['message_changed', 'message_hidden'].includes(event.type)) {
                    await loadChatMessages({ reset: true, preserveScroll: true });
                } else if (event.type === 'poll_changed') {
                    await loadChatPolls();
                } else if (event.type === 'room_changed') {
                    await loadRoomInfo();
                    await loadChatStatuses();
                    if (document.getElementById('groupSettingsModal').style.display === 'block') renderGroupSettings();
                    notifyOpenerUnreadChanged();
                } else if (event.type === 'room_removed') {
                    alert('방장에 의해 대화방에서 내보내졌습니다.');
                    window.close();
                }
            });
            chatSocket.on('chat_side_event', async event => {
                if (!event) return;
                if (['task_request_created', 'task_request_done', 'task_request_canceled'].includes(event.type)) {
                    await loadTaskRequests();
                }
            });
            chatSocket.on('chat_status', payload => applyChatStatusEvent(payload));
            chatSocket.on('chat_typing', event => {
                if (!event || event.user === currentUser) return;
                const indicator = document.getElementById('chatTypingIndicator');
                clearTimeout(typingDisplayTimer);
                indicator.textContent = event.is_typing ? `${event.user}님이 입력 중...` : '';
                indicator.style.color = 'blue';
                if (event.is_typing) {
                    typingDisplayTimer = setTimeout(() => { indicator.textContent = ''; }, 3000);
                }
            });
        }

        window.addEventListener('beforeunload', () => {
            sendTypingState(false);
            if (chatSocket && chatSocket.connected) chatSocket.emit('leave_chat_room', { partner: partnerName });
        });

        window.onload = async function() {
            registerWithOpener();
            initHeader();
            initializeChatFileDrop();
            document.getElementById('chatInput').addEventListener('input', handleChatInput);
            document.getElementById('chatInput').addEventListener('keydown', handleChatInputKeydown);
            resizeChatInput(document.getElementById('chatInput'));
            await loadChatPolls({ skipRender: true });
            await loadChatMessages({ reset: true });
            await loadChatStatuses();
            refreshTaskBadge();
            initializeChatSocket();
            document.getElementById('chatInput').focus();
        };
        setInterval(refreshChatBox, 30000);
    </script>
</body>
</html>
