<!doctype html>
<html lang="ko">
<head>
{% include 'instructor_hub/_portal_head.html' %}
<title>강사통합지원</title>
</head>
<body>
<div class="wrap" style="max-width:460px;padding-top:9vh">
  {% if invalid %}
  <div class="card" style="text-align:center">
    <h2>사용할 수 없는 링크입니다</h2>
    <p class="hint">링크가 바뀌었거나 사용이 중지되었습니다. 본사 담당자에게 새 링크를 요청해 주세요.</p>
  </div>
  {% else %}
  <div class="card">
    <p class="muted" style="margin:0 0 4px;font-weight:900;color:var(--accent)">새담 강사통합지원</p>
    <h2 style="font-size:1.4rem">{{ account.name }} 선생님, 안녕하세요</h2>
    <p class="hint">문자로 받은 비밀번호를 입력하면 프로필·홍보페이지·학생출석 화면으로 들어갑니다.</p>
    {% if error %}<div class="msg error">{{ error }}</div>{% endif %}
    <form method="post" autocomplete="off">
      <label for="pw">비밀번호</label>
      <input id="pw" type="password" name="password" inputmode="numeric" autocomplete="current-password" required autofocus>
      <button class="btn primary block" type="submit" style="margin-top:16px">들어가기</button>
    </form>
  </div>
  {% endif %}
</div>
</body>
</html>
