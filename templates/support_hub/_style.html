<style>
/* 강사통합지원 · 학부모통합지원 본사 화면 공통 스타일.
   스마트 명세서 발송처럼 화면 전체 폭을 쓰고(상한은 공통 콘텐츠 영역), 테마 색을 따라가며,
   글자는 가볍게(본문 400 · 강조 500 · 제목 600) 쓴다. */
.ih-page{
  --ih-primary:var(--primary-color,#2563eb);
  --ih-primary-soft:color-mix(in srgb,var(--ih-primary) 9%,#fff);
  --ih-primary-ring:color-mix(in srgb,var(--ih-primary) 22%,transparent);
  --ih-card:var(--card-bg,#fff);
  --ih-border:var(--card-border,var(--border-color,#dbe3ef));
  --ih-line:color-mix(in srgb,var(--ih-border) 62%,transparent);
  --ih-text:var(--text-color,#172033);
  --ih-muted:var(--text-gray,#64748b);
  --ih-surface:color-mix(in srgb,var(--ih-text) 3.2%,var(--ih-card));
  --ih-hover:var(--widget-hover,#f1f5f9);
  color:var(--ih-text);font-size:.94rem;font-weight:400;line-height:1.6;letter-spacing:-.012em;
  min-height:calc(100vh - 112px);
}
.ih-page *,.ih-page *::before,.ih-page *::after{box-sizing:border-box}
.ih-page button,.ih-page input,.ih-page select,.ih-page textarea{font:inherit;letter-spacing:inherit}
.ih-page [hidden]{display:none!important}
.ih-page a{color:var(--ih-primary);text-decoration:none}
.ih-page a:hover{text-decoration:underline}
.ih-page :is(h1,h2,h3){margin:0;font-weight:600;letter-spacing:-.03em}
.ih-page :is(strong,b,th,summary){font-weight:500}

/* 위쪽 안내 카드 */
.ih-hero{display:flex;align-items:center;justify-content:space-between;gap:18px 28px;flex-wrap:wrap;margin:0 0 18px;padding:20px 26px;
  border:1px solid var(--ih-border);border-radius:20px;
  background:radial-gradient(circle at 88% 0%,color-mix(in srgb,var(--ih-primary) 13%,transparent),transparent 36%),var(--ih-card);
  box-shadow:var(--card-shadow,0 10px 32px rgba(15,23,42,.05))}
.ih-hero-copy{display:flex;align-items:center;gap:16px;min-width:0;flex:1 1 360px}
.ih-hero-icon{width:50px;height:50px;flex:0 0 50px;display:grid;place-items:center;border-radius:15px;background:var(--ih-primary);color:#fff;font-size:1.2rem;
  box-shadow:0 10px 22px color-mix(in srgb,var(--ih-primary) 26%,transparent)}
.ih-hero h1{font-size:clamp(1.3rem,2vw,1.6rem)}
.ih-hero p{margin:5px 0 0;color:var(--ih-muted);font-size:.88rem;line-height:1.55}
.ih-pick{display:flex;align-items:center;gap:10px;flex:0 0 auto;max-width:100%}
.ih-pick label{color:var(--ih-muted);font-size:.84rem;font-weight:500;white-space:nowrap}
.ih-pick select{min-width:0;max-width:420px}

/* 본문 카드(탭 + 내용) */
.ih-card{background:var(--ih-card);border:1px solid var(--ih-border);border-radius:18px;box-shadow:var(--card-shadow,0 8px 28px rgba(15,23,42,.04));padding:22px;margin-bottom:16px}
.ih-main{padding:0;overflow:hidden}
.ih-tabs{display:flex;gap:4px;padding:10px;overflow-x:auto;border-bottom:1px solid var(--ih-border)}
.ih-tabs a{min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 18px;border-radius:11px;color:var(--ih-muted);
  font-size:.88rem;font-weight:500;white-space:nowrap;text-decoration:none!important;transition:.15s ease}
.ih-tabs a:hover{background:var(--ih-hover);color:var(--ih-text)}
.ih-tabs a.on{background:var(--ih-primary-soft);color:var(--ih-primary)}
.ih-tabs a b{min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 6px;border-radius:99px;background:#ef4444;color:#fff;font-size:.68rem;font-weight:500}
.ih-panel{padding:24px}
.ih-section{padding:20px;margin-bottom:16px;border:1px solid var(--ih-border);border-radius:15px;background:var(--ih-card)}
.ih-section:last-child{margin-bottom:0}
.ih-section>h2,.ih-card>h2{font-size:1.04rem;margin-bottom:4px}
.ih-hint{margin:0 0 14px;color:var(--ih-muted);font-size:.84rem;font-weight:400;line-height:1.6}

/* 단추 · 입력 */
.ih-btn{min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 15px;border:1px solid var(--ih-border);border-radius:11px;
  background:var(--ih-card);color:var(--ih-text);font-size:.84rem;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none!important;transition:.16s ease}
.ih-btn:hover{border-color:color-mix(in srgb,var(--ih-primary) 55%,var(--ih-border));color:var(--ih-primary);transform:translateY(-1px)}
.ih-btn.primary{background:var(--ih-primary);border-color:var(--ih-primary);color:#fff;box-shadow:0 6px 14px color-mix(in srgb,var(--ih-primary) 20%,transparent)}
.ih-btn.primary:hover{color:#fff;filter:brightness(.96)}
.ih-btn.danger{color:#dc2626}
.ih-btn.danger:hover{border-color:#fca5a5;color:#b91c1c;background:#fff7f7}
.ih-btn.sm{min-height:34px;padding:6px 11px;font-size:.78rem;border-radius:9px}
.ih-input,.ih-page textarea,.ih-page select{width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--ih-border);border-radius:11px;background:#fff;color:#172033;outline:none;font-size:.9rem;transition:.15s ease}
.ih-page textarea{line-height:1.65;resize:vertical}
.ih-input:focus,.ih-page textarea:focus,.ih-page select:focus{border-color:var(--ih-primary);box-shadow:0 0 0 3px var(--ih-primary-ring)}
.ih-page input[type=file]{padding:7px 10px;font-size:.84rem}
.ih-page input[type=checkbox]{accent-color:var(--ih-primary)}
.ih-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.ih-row label{display:flex;flex-direction:column;gap:5px;font-size:.78rem;font-weight:500;color:var(--ih-muted)}
.ih-row .ih-input{width:auto;min-width:0}
.ih-inline{display:inline}
.ih-mono{font-family:Consolas,"D2Coding",monospace;font-size:.82rem;word-break:break-all}

/* 알림 · 배지 */
.ih-flash{margin-bottom:14px;padding:12px 16px;border:1px solid transparent;border-radius:12px;font-size:.88rem;font-weight:400;white-space:pre-line}
.ih-flash.success{background:#f0fdf4;border-color:#bbf7d0;color:#166534}
.ih-flash.error{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.ih-warn{margin-bottom:14px;padding:12px 16px;border:1px solid #fde68a;border-radius:12px;background:#fffbeb;color:#92400e;font-size:.86rem}
.ih-badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:99px;background:var(--ih-surface);color:var(--ih-muted);font-size:.74rem;font-weight:500;white-space:nowrap}
.ih-badge.ok{background:#e8f8ee;color:#15803d}.ih-badge.off{background:#f1f5f9;color:#64748b}
.ih-badge.pend{background:#fef3c7;color:#92400e}.ih-badge.bad{background:#fee2e2;color:#b91c1c}
.ih-st{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;background:#f1f5f9;color:#64748b;font-size:.72rem;font-weight:500;white-space:nowrap}
.ih-st.approved{background:#e8f8ee;color:#15803d}.ih-st.pending{background:#fef3c7;color:#92400e}.ih-st.rejected{background:#fee2e2;color:#b91c1c}
.ih-pend{display:inline-flex;align-items:center;padding:2px 10px;border-radius:99px;background:#ef4444;color:#fff!important;font-size:.74rem;font-weight:500;text-decoration:none!important}

/* 요약 줄 */
.ih-sum{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 18px}
.ih-sum>span{padding:4px 12px;border-radius:99px;background:var(--ih-surface);color:var(--ih-muted);font-size:.8rem}
.ih-sum>span b{color:var(--ih-text);font-weight:500}
.ih-sum>span.school{background:var(--ih-primary-soft);color:var(--ih-primary);font-weight:500}

/* 표 */
.ih-table{width:100%;border-collapse:separate;border-spacing:0;font-size:.86rem}
.ih-table th{padding:10px 12px;background:var(--ih-surface);color:var(--ih-muted);font-size:.74rem;text-align:left;white-space:nowrap;border-bottom:1px solid var(--ih-border)}
.ih-table th:first-child{border-top-left-radius:10px}.ih-table th:last-child{border-top-right-radius:10px}
.ih-table td{padding:13px 12px;border-bottom:1px solid var(--ih-line);vertical-align:middle}
.ih-table tbody tr:hover td{background:color-mix(in srgb,var(--ih-hover) 55%,transparent)}
.ih-table tbody tr:last-child td{border-bottom:0}
.ih-table td .ih-hint{margin:2px 0 0;font-size:.76rem}

/* 접이식 등록 방법 */
.ih-way{margin-bottom:10px;border:1px solid var(--ih-border);border-radius:14px;background:var(--ih-card);transition:.15s ease}
.ih-way[open]{border-color:var(--ih-primary-ring);box-shadow:0 6px 18px rgba(15,23,42,.04)}
.ih-way>summary{display:flex;align-items:center;gap:10px;padding:13px 18px;cursor:pointer;list-style:none;font-size:.9rem;font-weight:500}
.ih-way>summary::-webkit-details-marker{display:none}
.ih-way>summary::before{content:'';width:7px;height:7px;border-right:1.5px solid var(--ih-muted);border-bottom:1.5px solid var(--ih-muted);transform:rotate(-45deg);transition:.15s ease}
.ih-way[open]>summary::before{transform:rotate(45deg)}
.ih-way .body{padding:2px 18px 18px}
/* ---- 강사 · 승인 화면 ---- */
.ih-listhead{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.ih-listhead h2{margin:0 auto 0 0;font-size:1.04rem}
.ih-listhead .ih-input{width:240px}
.ih-group{margin-top:20px}
.ih-group:first-of-type{margin-top:6px}
.ih-group h3{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:.92rem}
.ih-group .ih-table{table-layout:fixed;min-width:760px}
.ih-more>summary{cursor:pointer;display:inline-flex;list-style:none}
.ih-more>summary::-webkit-details-marker{display:none}
.ih-more .panel{margin-top:8px;padding:10px;border:1px solid var(--ih-border);border-radius:12px;background:var(--ih-surface)}
.ih-more .panel .sep{flex-basis:100%;height:0;border-top:1px dashed var(--ih-border);margin:2px 0}
.ih-more .panel form.edit{display:flex;gap:6px;flex-wrap:wrap;flex-basis:100%}
.ih-more .panel form.edit .ih-input{min-height:36px;padding:6px 9px;font-size:.84rem;flex:1 1 110px;width:auto}
details.ih-section>summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;cursor:pointer;list-style:none;font-size:.98rem;font-weight:500}
details.ih-section>summary::-webkit-details-marker{display:none}
details.ih-section>summary::before{content:'';width:7px;height:7px;border-right:1.5px solid var(--ih-muted);border-bottom:1.5px solid var(--ih-muted);transform:rotate(-45deg);transition:.15s ease}
details.ih-section[open]>summary::before{transform:rotate(45deg)}
.ih-plain{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:11px 0;border-top:1px solid var(--ih-line)}
/* 승인관리: 강사 한 명이 한 줄 */
.ih-rv-head,.ih-rv{display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,1fr);gap:14px}
.ih-rv-head{padding:0 18px 8px;color:var(--ih-muted);font-size:.74rem;font-weight:500}
.ih-rv{align-items:stretch;padding:14px 18px;margin-bottom:10px;border:1px solid var(--ih-border);border-radius:16px;background:var(--ih-card);transition:.15s ease}
.ih-rv:hover{box-shadow:0 8px 22px rgba(15,23,42,.05)}
.ih-rv.need{border-color:#fcd34d;box-shadow:inset 4px 0 0 #f59e0b}
.ih-rv .who b{display:block;font-size:1rem;font-weight:500}
.ih-rv .who span{display:block;color:var(--ih-muted);font-size:.8rem}
.ih-rv .cell{min-width:0;padding:12px 14px;border:1px solid var(--ih-line);border-radius:13px;background:var(--ih-surface)}
.ih-rv .cell.pending{border-color:#fde68a;background:#fffbeb}
.ih-rv .cell.empty{border-style:dashed;background:none;color:var(--ih-muted);font-size:.82rem}
.ih-rv .cellhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;color:var(--ih-muted);font-size:.74rem}
.ih-rv .prof{display:flex;gap:12px;align-items:flex-start}
.ih-rv .prof img{width:64px;height:64px;flex:none;border-radius:50%;object-fit:cover;border:1px solid var(--ih-border);background:#fff}
.ih-rv .bio{margin:0;font-size:.84rem;font-weight:400;line-height:1.6;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ih-rv .bio.open{display:block;-webkit-line-clamp:unset}
.ih-rv .more-btn{border:0;background:none;padding:2px 0;color:var(--ih-primary);font-size:.76rem;font-weight:500;cursor:pointer}
.ih-rv .thumbs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ih-rv .thumbs img{width:54px;aspect-ratio:3/4;object-fit:cover;border-radius:7px;border:1px solid var(--ih-border);background:#fff}
.ih-rv .thumbs span{color:var(--ih-muted);font-size:.78rem}
.ih-rv .decide{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ih-rv .why{margin:8px 0 0;color:#b91c1c;font-size:.78rem}
@media (max-width:760px){.ih-pick,.ih-pick select{width:100%}.ih-pick{flex-direction:column;align-items:stretch;gap:6px}.ih-listhead .ih-input{width:100%}.ih-rv-head{display:none}.ih-rv{grid-template-columns:1fr}.ih-panel{padding:16px}}
/* ---- 학부모 안내 화면 ---- */
.ih-row.mid{align-items:center}
.ih-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:0 0 18px}
.ih-steps div{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--ih-border);border-radius:14px;background:var(--ih-card);color:var(--ih-muted);font-size:.82rem;line-height:1.55}
.ih-steps b{width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--ih-primary-soft);color:var(--ih-primary);font-size:.76rem;font-weight:500}
.ih-steps strong{display:block;color:var(--ih-text);font-size:.88rem;font-weight:500}
.ih-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.ih-tools .ih-input{width:auto}
.ih-stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.ih-stats span{flex:1 1 170px;padding:14px 18px;border:1px solid var(--ih-border);border-radius:14px;background:var(--ih-surface);color:var(--ih-muted);font-size:.8rem}
.ih-stats b{display:block;font-size:1.5rem;font-weight:500;line-height:1.3;color:var(--ih-text)}
.ih-school{display:grid;grid-template-columns:132px 1fr;gap:20px;padding:20px 0;border-top:1px solid var(--ih-line)}
.ih-school:first-of-type{border-top:0}
.ih-school.none{grid-template-columns:1fr;padding:14px 0;opacity:.85}
.ih-school img.qr{width:120px;height:120px;padding:4px;border:1px solid var(--ih-border);border-radius:12px;background:#fff}
.ih-school h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 6px;font-size:1rem}
.ih-nums{display:flex;gap:6px 18px;flex-wrap:wrap;margin:8px 0;color:var(--ih-muted);font-size:.82rem}
.ih-nums b{color:var(--ih-text);font-size:.92rem;font-weight:500}
details.ih-more{margin-top:12px;padding:12px 16px;border:1px solid var(--ih-border);border-radius:12px;background:var(--ih-surface)}
details.ih-more summary{cursor:pointer;font-size:.86rem;font-weight:500}
.ih-form{display:grid;gap:12px;margin-top:14px}
.ih-form label{display:flex;flex-direction:column;gap:5px;color:var(--ih-muted);font-size:.78rem;font-weight:500}
.ih-checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.ih-form .ih-checks label{flex-direction:row;align-items:flex-start;gap:9px;padding:10px 13px;border:1px solid var(--ih-border);border-radius:11px;background:var(--ih-card);color:var(--ih-text);font-size:.84rem;font-weight:400}
.ih-checks small{display:block;color:var(--ih-muted);font-size:.74rem}
.ih-toc{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.ih-toc span{padding:4px 12px;border-radius:99px;background:var(--ih-surface);color:var(--ih-muted);font-size:.8rem}
.ih-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin:12px 0 16px}
.ih-thumb{padding:8px;border:1px solid var(--ih-border);border-radius:13px;background:var(--ih-card);text-align:center}
.ih-thumb img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;border:1px solid var(--ih-border);background:#fff}
.ih-thumb .acts{display:flex;gap:4px;justify-content:center;margin-top:6px}
.ih-thumb small{display:block;margin-top:5px;color:var(--ih-muted);font-size:.74rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:760px){.ih-school{grid-template-columns:1fr}.ih-panel{padding:16px}}

/* ---- 통합지원 화면에서 새로 쓰는 부품 ---- */
.ih-hero p b{font-weight:500;color:var(--ih-text)}
.ih-checks2{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.ih-checks2 a{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border:1px solid var(--ih-border);border-radius:99px;background:var(--ih-card);color:var(--ih-muted);font-size:.8rem;text-decoration:none!important;transition:.15s ease}
.ih-checks2 a:hover{border-color:var(--ih-primary);color:var(--ih-primary)}
.ih-checks2 a i{font-size:.78rem}
.ih-checks2 a.ok{color:#15803d;background:#f0fdf4;border-color:#bbf7d0}
.ih-checks2 a.todo{color:#b45309;background:#fffbeb;border-color:#fde68a}
.ih-checks2 a.opt{color:var(--ih-muted);background:var(--ih-surface)}
.ih-grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 14px}
.ih-grid2 label,.ih-field label{display:flex;flex-direction:column;gap:5px;color:var(--ih-muted);font-size:.78rem;font-weight:500}
.ih-grid2 .wide{grid-column:1/-1}
.ih-days{display:flex;gap:6px;flex-wrap:wrap}
.ih-days label{flex-direction:row;align-items:center;gap:6px;padding:7px 13px;border:1px solid var(--ih-border);border-radius:99px;background:#fff;color:var(--ih-text);font-size:.84rem;font-weight:400;cursor:pointer}
.ih-days label:has(input:checked){border-color:var(--ih-primary);background:var(--ih-primary-soft);color:var(--ih-primary)}
.ih-radio{display:grid;gap:8px}
.ih-radio label{flex-direction:row;align-items:flex-start;gap:9px;padding:10px 13px;border:1px solid var(--ih-border);border-radius:11px;background:#fff;color:var(--ih-text);font-size:.84rem;font-weight:400}
.ih-radio small{display:block;color:var(--ih-muted);font-size:.74rem}
.ih-check{flex-direction:row!important;align-items:center;gap:8px!important;color:var(--ih-text)!important;font-size:.86rem!important;font-weight:400!important}
.ih-split{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.ih-classrow td.cls{font-weight:500}
.ih-classrow.cur td{background:var(--ih-primary-soft)}
.ih-classrow.cur td:first-child{box-shadow:inset 3px 0 0 var(--ih-primary)}
.ih-sub{color:var(--ih-muted);font-size:.76rem;font-weight:400}
.ih-flashline{margin:0 0 14px}
.ih-send{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.ih-send textarea{min-height:92px}
.ih-bubble{padding:16px 18px;border-radius:16px;background:var(--ih-surface);border:1px solid var(--ih-line);font-size:.84rem;white-space:pre-wrap;line-height:1.7;color:var(--ih-text)}
@media (max-width:900px){.ih-send{grid-template-columns:1fr}}
.ih-bubble.kakao{background:#fff8d6;border-color:#f3e08a}
.ih-step{margin:0 0 18px;padding:0 0 18px;border-bottom:1px solid var(--ih-line)}
.ih-step h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:.92rem}
.ih-no{width:22px;height:22px;flex:0 0 22px;display:inline-grid;place-items:center;border-radius:50%;background:var(--ih-primary-soft);color:var(--ih-primary);font-size:.74rem;font-weight:600}
.ih-radio .ih-count{margin-left:auto;padding:3px 10px;border:1px solid var(--ih-border);border-radius:99px;background:var(--ih-surface);color:var(--ih-primary);font-size:.78rem;font-weight:500;cursor:pointer;white-space:nowrap}
.ih-radio .ih-count:hover,.ih-radio .ih-count.on{border-color:var(--ih-primary);background:var(--ih-primary-soft)}
.ih-radio .ih-count i{font-size:.62rem;margin-left:3px;transition:transform .15s}
.ih-radio .ih-count[aria-expanded=true] i{transform:rotate(180deg)}
.ih-radio label{align-items:center}
.ih-who-sum{margin:10px 0 0;color:var(--ih-muted);font-size:.84rem}
.ih-who-sum #whoSum{color:var(--ih-text);font-weight:500}
.ih-linkbtn{padding:0;border:0;background:none;color:var(--ih-primary);font-size:.82rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.ih-who-panel{margin-top:10px;padding:12px;border:1px solid var(--ih-border);border-radius:14px;background:var(--ih-surface)}
.ih-who-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.ih-who-bar .ih-input{flex:1 1 200px;width:auto;min-height:36px;padding:6px 10px;font-size:.84rem}
.ih-who-list{max-height:320px;overflow:auto;display:grid;gap:6px;padding-right:2px}
.ih-who{display:grid;grid-template-columns:auto minmax(120px,1.1fr) minmax(0,1fr);gap:2px 10px;align-items:center;padding:8px 11px;border:1px solid var(--ih-border);border-radius:10px;background:#fff;color:var(--ih-text);font-size:.84rem;font-weight:400;cursor:pointer}
.ih-who:has(input:checked){border-color:var(--ih-primary);background:var(--ih-primary-soft)}
.ih-who.bad{opacity:.65;cursor:default}
.ih-who.nomatch{display:none}
.ih-who input{grid-row:1/3;width:auto;margin:0}
.ih-who .who-name small{margin-left:4px;color:var(--ih-muted);font-size:.76rem}
.ih-who .who-kids{color:var(--ih-muted);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ih-who .who-tags{grid-column:2/-1;display:flex;gap:5px;flex-wrap:wrap}
.ih-who .who-tags em{padding:1px 8px;border-radius:99px;background:var(--ih-surface);border:1px solid var(--ih-line);color:var(--ih-muted);font-size:.72rem;font-style:normal}
.ih-who .who-tags em.on{background:#ecfdf5;border-color:#a7f3d0;color:#047857}
.ih-who .who-tags em.warn{background:#fffbeb;border-color:#fde68a;color:#b45309}
.ih-methods{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.ih-method{display:flex;gap:9px;align-items:flex-start;padding:11px 13px;border:1px solid var(--ih-border);border-radius:11px;background:#fff;color:var(--ih-text);font-size:.86rem;font-weight:400;cursor:pointer}
.ih-method:has(input:checked){border-color:var(--ih-primary);background:var(--ih-primary-soft)}
.ih-method.off{opacity:.55;cursor:not-allowed}
.ih-method input{margin-top:4px}
.ih-method small{display:block;margin-top:2px;color:var(--ih-muted);font-size:.76rem;line-height:1.5}
.ih-method code{font-size:.74rem}
.ih-vars{margin:0 0 4px}
.ih-vars td,.ih-vars th{padding:7px 10px;font-size:.8rem}
@media (max-width:560px){.ih-who{grid-template-columns:auto minmax(0,1fr)}.ih-who .who-kids,.ih-who .who-tags{grid-column:2}}
</style>
