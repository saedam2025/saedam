services:
  - type: web
    name: saedam-intranet
    runtime: python
    buildCommand: bash render-build.sh
    startCommand: gunicorn --workers 1 --threads 100 --timeout 600 --bind 0.0.0.0:$PORT app:app
    numInstances: 1
    disk:
      name: saedam-data
      mountPath: /mnt/data
      sizeGB: 5
    envVars:
      - key: DATA_DIR
        value: /mnt/data
      # 실수로 임시 파일시스템 실행을 허용하지 않는다. Persistent Disk가
      # 빠진 배포는 시작 단계에서 실패하여 명세서 데이터 유실을 막는다.
      - key: ALLOW_EPHEMERAL_DATA_ON_RENDER
        value: "false"
      # 통합관리 > 시스템관리 > 솔라피설정에 저장한 값이 우선이며,
      # 아래 값은 신규 배포 또는 DB 미설정 시 안전한 환경변수 폴백으로 사용한다.
      - key: SOLAPI_API_KEY
        sync: false
      - key: SOLAPI_API_SECRET
        sync: false
      - key: SOLAPI_PF_ID
        sync: false
      - key: SOLAPI_TEMPLATE_ID
        sync: false
      - key: SOLAPI_FROM
        sync: false
      # 업무지원 > 입찰공고관리: 나라장터 입찰공고정보서비스 인증키(공공데이터포털 일반 인증키).
      # 화면의 [수집·메일 설정]에 저장한 값이 우선이며, 아래 값은 저장값이 없을 때만 쓴다.
      - key: G2B_SERVICE_KEY
        sync: false
